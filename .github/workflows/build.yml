name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip openjdk-17-jdk \
            autoconf automake libtool pkg-config \
            zlib1g-dev libffi-dev libssl-dev \
            libncurses-dev cmake libltdl-dev
          sudo ln -sf /usr/lib/x86_64-linux-gnu/libtinfo.so.6 /usr/lib/x86_64-linux-gnu/libtinfo.so.5
          sudo ldconfig

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r requirements.txt

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Android SDK components
        shell: bash
        run: |
          set -euxo pipefail
          SDK_ROOT="$HOME/.buildozer/android/platform/android-sdk"
          CMDLINE_TOOLS="$RUNNER_TEMP/cmdline-tools.zip"

          mkdir -p "$SDK_ROOT/cmdline-tools"
          curl -fsSL -o "$CMDLINE_TOOLS" \
            "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"

          rm -rf "$SDK_ROOT/cmdline-tools/latest"
          mkdir -p "$SDK_ROOT/cmdline-tools/latest"

          unzip -q "$CMDLINE_TOOLS" -d "$RUNNER_TEMP/android-cmdline-tools"
          mv "$RUNNER_TEMP/android-cmdline-tools/cmdline-tools/"* "$SDK_ROOT/cmdline-tools/latest/"

          mkdir -p "$SDK_ROOT/tools"
          ln -sfn "$SDK_ROOT/cmdline-tools/latest/bin" "$SDK_ROOT/tools/bin"
          ln -sfn "$SDK_ROOT/cmdline-tools/latest/lib" "$SDK_ROOT/tools/lib"

          export ANDROID_HOME="$SDK_ROOT"
          export ANDROID_SDK_ROOT="$SDK_ROOT"
          export PATH="$SDK_ROOT/cmdline-tools/latest/bin:$SDK_ROOT/platform-tools:$PATH"

          set +o pipefail
          yes | sdkmanager --sdk_root="$SDK_ROOT" --licenses
          sdkmanager_status=${PIPESTATUS[1]}
          set -o pipefail

          if [ "$sdkmanager_status" -ne 0 ]; then
            exit "$sdkmanager_status"
          fi

          sdkmanager --sdk_root="$SDK_ROOT" \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"

          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/build-tools/34.0.0" >> "$GITHUB_PATH"

      - name: Build with Buildozer
        run: |
          rm -rf .buildozer bin
          python --version
          python -m buildozer -v android debug
        env:
          ANDROID_ACCEPT_LICENSES: "yes"
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-apk
          path: bin/*.apk
          if-no-files-found: warn
