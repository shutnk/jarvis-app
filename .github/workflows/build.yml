name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip openjdk-17-jdk \
            python3-pip python3-venv \
            autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev \
            cmake libffi-dev libssl-dev \
            automake autopoint gettext

      - name: Set up Android SDK
        shell: bash
        run: |
          set -euxo pipefail

          SDK_ROOT="$HOME/.buildozer/android/platform/android-sdk"
          CMDLINE_TOOLS="$RUNNER_TEMP/cmdline-tools.zip"

          mkdir -p "$SDK_ROOT/cmdline-tools"
          curl -fsSL -o "$CMDLINE_TOOLS" \
            "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"

          rm -rf "$SDK_ROOT/cmdline-tools/latest"
          mkdir -p "$SDK_ROOT/cmdline-tools/latest"

          unzip -q "$CMDLINE_TOOLS" -d "$RUNNER_TEMP/android-cmdline-tools"
          mv "$RUNNER_TEMP/android-cmdline-tools/cmdline-tools/"* "$SDK_ROOT/cmdline-tools/latest/"

          # Симлинки для Buildozer (он ищет sdkmanager по старым путям)
          mkdir -p "$SDK_ROOT/tools"
          ln -sfn "$SDK_ROOT/cmdline-tools/latest/bin" "$SDK_ROOT/tools/bin"
          ln -sfn "$SDK_ROOT/cmdline-tools/latest/lib" "$SDK_ROOT/tools/lib"

          export ANDROID_HOME="$SDK_ROOT"
          export ANDROID_SDK_ROOT="$SDK_ROOT"
          export PATH="$SDK_ROOT/cmdline-tools/latest/bin:$SDK_ROOT/platform-tools:$PATH"

          # Принимаем лицензии (важно: проверяем статус именно sdkmanager, не yes)
          set +o pipefail
          yes | sdkmanager --sdk_root="$SDK_ROOT" --licenses
          sdkmanager_status=${PIPESTATUS[1]}
          set -o pipefail

          if [ "$sdkmanager_status" -ne 0 ]; then
            exit "$sdkmanager_status"
          fi

          # Устанавливаем нужные компоненты
          sdkmanager --sdk_root="$SDK_ROOT" \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"

          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/build-tools/34.0.0" >> "$GITHUB_PATH"

      - name: Install Buildozer
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install buildozer

      - name: Build APK
        run: |
          rm -rf .buildozer bin
          buildozer android debug
        env:
          ANDROID_ACCEPT_LICENSES: "yes"
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-apk
          path: bin/*.apk
          if-no-files-found: warn
